# For a cluster with NVIDIA GPUs and the NVIDIA device plugin / GPU Operator installed:
#   kubectl apply -k k8s/overlays/gpu
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: ConfigMap, name: docs-rag-config}
    patch: |-
      - op: replace
        path: /data/LLM_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
  - target: {kind: Deployment, name: vllm}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: vllm/vllm-openai:latest
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--model=$(MODEL)", "--served-model-name=$(MODEL)", "--max-model-len=8192", "--gpu-memory-utilization=0.90", "--port=8000"]
      - op: remove
        path: /spec/template/spec/containers/0/env/1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
          limits: {memory: 24Gi, nvidia.com/gpu: 1}
