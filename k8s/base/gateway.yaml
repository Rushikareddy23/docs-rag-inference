apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-rag-config
  namespace: docs-rag
data:
  LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
  LLM_BASE_URL: http://vllm:8000/v1
  RETRIEVER_URL: http://retriever:8001
  TOP_K: "4"
  MAX_AGENT_STEPS: "3"
  VERIFY_ANSWERS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: docs-rag
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: docs-rag/gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: docs-rag-config}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: docs-rag
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Scale the stateless gateway on CPU. (vLLM is scaled by adding GPUs, not by this HPA.)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: docs-rag
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
