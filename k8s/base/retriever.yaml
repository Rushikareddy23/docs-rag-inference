apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  namespace: docs-rag
  labels: {app: retriever}
spec:
  replicas: 1
  selector:
    matchLabels: {app: retriever}
  template:
    metadata:
      labels: {app: retriever}
    spec:
      containers:
        - name: retriever
          image: docs-rag/retriever:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8001}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          # the index is pre-built in the image, but loading the embedding model still takes a few seconds
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: retriever
  namespace: docs-rag
spec:
  selector: {app: retriever}
  ports:
    - {name: http, port: 8001, targetPort: http}
